image: python:3.11

stages:
    - build
    - deploy

docker-build:
    stage: build
    image: docker:24.0.5
    services:
        - docker:24.0.5-dind
    variables:
        DOCKER_DRIVER: overlay2
        DOCKER_TLS_CERTDIR: ''
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    script:
        - docker build -t $CI_REGISTRY_IMAGE/control-plane-api:$CI_COMMIT_TAG -f src/control-plane-api/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/control-plane-api:$CI_COMMIT_TAG
        - docker build -t $CI_REGISTRY_IMAGE/resource-scheduler:$CI_COMMIT_TAG -f src/resource-scheduler/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/resource-scheduler:$CI_COMMIT_TAG
        - docker build -t $CI_REGISTRY_IMAGE/worker-controller:$CI_COMMIT_TAG -f src/worker-controller/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/worker-controller:$CI_COMMIT_TAG
        - docker build -t $CI_REGISTRY_IMAGE/lablet-controller:$CI_COMMIT_TAG -f src/lablet-controller/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/lablet-controller:$CI_COMMIT_TAG
    rules:
        - if: $CI_COMMIT_TAG

pages:
    stage: deploy
    script:
        - pip install poetry
        - poetry config virtualenvs.create false
        - poetry install --only docs --no-root
        - mkdocs build -d public
    artifacts:
        paths:
            - public
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
