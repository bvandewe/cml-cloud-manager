[tool.poetry]
name = "lcm-core"
version = "0.1.0"
description = "Shared core package for Lablet Cloud Manager services"
authors = ["Architecture Team <architecture@example.com>"]
readme = "README.md"
packages = [{include = "lcm_core"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
neuroglia-python = ">=0.9.1,<0.10.0"
aiohttp = ">=3.9.0,<4.0.0"
httpx = ">=0.24.0,<0.28.0"
pydantic = ">=2.0.0,<3.0.0"
etcd3-py = "^0.1.6"
pyyaml = ">=6.0.0,<7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
ruff = ">=0.1.0"
black = ">=23.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 120
target-version = ["py311"]
