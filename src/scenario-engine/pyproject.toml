[tool.poetry]
name = "scenario-engine"
version = "0.1.0"
description = "Lablet Cloud Manager - Scenario Engine Service (Pod Automation)"
authors = ["Bruno van de Werve <bvandewe@gmail.com>"]
readme = "README.md"
packages = [{include = "application"}, {include = "domain"}, {include = "integration"}, {include = "infrastructure"}, {include = "scenarios"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
neuroglia-python = ">=0.9.3,<0.10.0"
httpx = ">=0.24.0,<0.28.0"
motor = "^3.3.0"
uvicorn = ">=0.24.0,<1.0.0"
pyyaml = ">=6.0.0,<7.0.0"
jq = ">=1.6.0,<2.0.0"
# Transitive deps from lcm-core: re-declared here because the Dockerfile strips
# the lcm-core path dependency before `poetry install` (lcm-core is mounted at
# runtime from /core). Keep these in sync with src/core/pyproject.toml.
jsonschema = ">=4.20.0,<5.0.0"  # used by lcm_core.infrastructure.content_store.pav1_validator
boto3 = "^1.40.74"              # used by lcm_core.infrastructure.content_store.s3_content_client
lcm-core = {path = "../core", develop = true}

[tool.poetry.group.dsl.dependencies]
pyjq = {version = "^2.6.0", optional = true}  # Legacy: replaced by jq package

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = "^1.11.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# F811 is expected for @dispatch-decorated methods (multiple dispatch pattern)
"domain/entities/*.py" = ["F811"]

[tool.black]
line-length = 200

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]
