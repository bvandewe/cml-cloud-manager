    - boot_disk_size: null
      configuration:
          - name: node.cfg
            content: |-
                # this is a shell script which will be sourced at boot
                sudo hostname vManageMockAPI

                sudo tee /etc/network/interfaces > /dev/null <<EOF
                auto lo
                iface lo inet loopback

                auto eth0
                iface eth0 inet static
                    address 192.168.10.1/24
                    gateway 192.168.10.254
                    dns-nameservers 192.168.255.1
                EOF

                # configurable user account
                USERNAME=cisco
                PASSWORD=cisco

                # Start vManage Mock API service
                sudo -u cisco /home/cisco/.local/bin/mockctl start vmanage >> /home/cisco/vmanage-mock.log 2>&1 &
      cpu_limit: null
