# Default System Settings
# Global configuration for the Lablet Cloud Manager
#
# These settings are seeded on first startup and can be modified via the API.

id: default
name: Default System Settings
description: Default configuration for Lablet Cloud Manager

# Worker Provisioning (used when creating new workers)
worker_provisioning:
    ami_name_default: cisco-cml2.9-lablet-v0.1.8
    instance_type: m5zn.metal
    security_group_ids:
        - sg-0c509ac3094df5a77
    subnet_id: subnet-1f765943
    ami_ids:
        us-east-1: ami-005a8fc7d32510d94
    ami_names:
        us-east-1: cisco-cml2.9-lablet-v0.1.8

# Monitoring Settings
monitoring:
    worker_metrics_poll_interval_seconds: 300

# Idle Detection Settings
idle_detection:
    enabled: true
    timeout_minutes: 60

# Worker Discovery Settings (ADR-012)
# Controls how worker-controller discovers EC2 instances
discovery:
    enabled: true
    regions:
        - us-east-1
    ami_name_pattern: 'cisco-cml2.9*'
    scan_interval_seconds: 300

# Resource Scheduling (legacy - may be removed)
enable_auto_scaling: true
min_workers: 1
max_workers: 10
scale_up_threshold: 0.8 # Scale up when utilization > 80%
scale_down_threshold: 0.2 # Scale down when utilization < 20%
scale_cooldown_minutes: 10

# Lab Management (legacy - may be removed)
default_lab_timeout_minutes: 120
max_labs_per_worker: 20
lab_auto_stop_enabled: true

# Audit
created_by: seeder
