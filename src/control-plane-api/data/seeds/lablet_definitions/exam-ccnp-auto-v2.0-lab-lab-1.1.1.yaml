# Lablet Definition: AUTOCOR_350-901_LAB-1.1.1
# A 9-node enterprise lab with routers, switches, and desktop
#
# Lab Topology (from CML YAML):
#   [rtr01] ---Gi0/1--- Gi0/1 [rtr02]
#   (iosv)                      (iosv)
#     Gi0/0                       Gi0/0
#       |                           |
#     port0 [oob-sw] port1----------+
#       (unmanaged_switch)
#     port2   port3   port4
#       |       |       |
#   [sw01]  [sw02]  [workstation]
#   (iosvl2) (iosvl2) (ubuntu-desktop-24-04-v2)
#                         ens4
#                          |
#                      [ext-conn-0]
#
#   [ext-conn-1] --- [cmlctl-0]
#
# Network: 192.168.10.0/24
#   rtr01: .11/.21   rtr02: .12/.22
#
# Source: SVN /Lablets/350-901/LAB-1.1.1
# Mosaic: FormId=68b054a4c8858c6b7ce7d2b8, FormSetId=68b054a4c8858c6b7ce7d2b3
# AMI: cisco-cml2.9.1-20nodes-v0.2.2c
#
# Port Mapping (derived from CML node tags):
#   - rtr01:       serial:5045
#   - rtr02:       serial:5046
#   - sw01:        serial:5048
#   - sw02:        serial:5049
#   - workstation: serial:5050, vnc:5051, pat:5052:22
#   - cmlctl-0:    serial:5047

id: exam-ccnp-auto-v2.0-lab-lab-1.1.1-v1.0.0
name: exam-ccnp-auto-v2.0-lab-lab-1.1.1
version: '1.0.0'
description: >-
    A 9-node enterprise automation lab with two IOSv routers, two IOSvL2
    switches, an Ubuntu desktop workstation, and OOB management switch.
    Part of CCNP AUTO v2.0 (350-901 AUTOCOR) LAB 1.1.1.

# Content identification (FQN: trackType trackLevel trackAcronym examVersion moduleAcronym formName)
# Source: mosaic_meta.json → TrackShortName=AUTOCOR, ExamVersion=2.0, FormName=LAB-1.1.1
form_qualified_name: Exam CCNP AUTO v2.0 LAB LAB-1.1.1

# Artifact references (populated by content sync, optional at seed time)
lab_yaml_hash: '' # Will be populated by content sync
grading_rules_uri: null # Will be populated by content sync

# Resource requirements (based on CML node definitions)
# - iosv ×2:                    ~1 vCPU, 512MB RAM each
# - iosvl2 ×2:                  ~1 vCPU, 768MB RAM each
# - ubuntu-desktop-24-04-v2 ×1: ~2 vCPU, 4GB RAM
# - unmanaged_switch ×1:        ~0 vCPU, 0MB (L2 only)
# - cmlctl ×1:                  ~1 vCPU, 1GB RAM
# - external_connector ×2:      ~0 vCPU, 0MB
# Total: ~7 vCPU, ~7.5 GB RAM
resource_requirements:
    cpu_cores: 8
    memory_gb: 8
    storage_gb: 128
    nested_virt: true
    ami_requirements:
        - cml_version_min: '2.9.1'
          node_definitions_required:
              - iosv
              - iosvl2
              - ubuntu-desktop-24-04-v2
              - unmanaged_switch
              - cmlctl
              - external_connector

# Lab metadata
node_count: 9
license_affinity:
    - personal

# Port template (ports to be dynamically allocated per instance)
# Port names follow from_cml_nodes convention: {sanitized_node_label}_{protocol}
port_template:
    ports:
        # rtr01 — tags: [serial:5045]
        - name: rtr01_serial
          protocol: tcp
          description: serial on rtr01
        # rtr02 — tags: [serial:5046]
        - name: rtr02_serial
          protocol: tcp
          description: serial on rtr02
        # cmlctl-0 — tags: [serial:5047]
        - name: cmlctl-0_serial
          protocol: tcp
          description: serial on cmlctl-0
        # sw01 — tags: [serial:5048]
        - name: sw01_serial
          protocol: tcp
          description: serial on sw01
        # sw02 — tags: [serial:5049]
        - name: sw02_serial
          protocol: tcp
          description: serial on sw02
        # workstation — tags: [serial:5050, vnc:5051, pat:5052:22]
        - name: workstation_serial
          protocol: tcp
          description: serial on workstation
        - name: workstation_vnc
          protocol: tcp
          description: vnc on workstation
        - name: workstation_pat_22
          protocol: tcp
          description: pat (SSH) on workstation

# Session configuration
max_duration_minutes: 120 # 2 hours max session time
warm_pool_depth: 0 # No pre-instantiated instances

# Lab binding options
lab_reuse_enabled: true

# Ownership and notifications
owner_notification:
    email: lab-admin@example.com
    notify_on_start: true
    notify_on_complete: true
    notify_on_error: true

created_by: seeder

# ─────────────────────────────────────────────────────────────
# Pipeline Definitions (AD-PIPELINE-012)
#
# Uses standard templates via `extends`. No definition-specific
# overrides needed — all timeouts and steps match defaults.
# ─────────────────────────────────────────────────────────────
pipelines:
    instantiate:
        extends: standard-instantiate

    collect_evidence:
        extends: standard-collect-evidence

    compute_grading:
        extends: standard-compute-grading

    teardown:
        extends: standard-teardown
