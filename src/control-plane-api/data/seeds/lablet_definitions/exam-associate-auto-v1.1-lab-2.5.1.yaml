# Lablet Definition: TEST-LAB-1.1
# A test lab with PC (Ubuntu Desktop), IOSv router, and vManage Mock API
#
# Lab Topology:
#   [PC] ---ens3--- Gi0/0 [Router] Gi0/1 ---eth0--- [vManageMockAPI]
#   (ubuntu-desktop)       (iosv)                    (vmanagemock)
#
# Network Configuration:
#   - PC: DHCP from LAN_POOL (192.168.0.0/24)
#   - Router: Gateway for both subnets
#   - vManageMockAPI: Static 192.168.10.1/24
#
# Port Mapping (derived from node tags):
#   - PC:             serial:4567, vnc:4568
#   - Router (iosv):  serial:4566
#   - vManageMockAPI: serial:4569

id: exam-associate-auto-v1.1-lab-2.5.1-v1.0.0
name: exam-associate-auto-v1.1-lab-2.5.1
version: '1.0.0'
description: >-
    A 3-node test lab demonstrating connectivity between an Ubuntu Desktop PC,
    an IOSv router with DHCP server, and a vManage Mock API service.
    Ideal for testing SD-WAN automation workflows.

# Content identification (FQN: trackType trackLevel trackAcronym examVersion moduleAcronym formName)
form_qualified_name: Exam Associate Auto v1.1 LAB 2.5.1

# Artifact references (populated by content sync, optional at seed time)
lab_yaml_hash: '' # Will be populated by content sync
grading_rules_uri: null # Will be populated by content sync

# Resource requirements (based on node definitions)
# - ubuntu-desktop-24-04-v2: ~2 vCPU, 4GB RAM
# - iosv: ~1 vCPU, 512MB RAM
# - vmanagemock: ~1 vCPU, 1GB RAM
resource_requirements:
    cpu_cores: 4
    memory_gb: 8
    storage_gb: 50
    nested_virt: true
    ami_requirements:
        - cml_version_min: '2.7.0'
          node_definitions_required:
              - ubuntu-desktop-24-04-v2
              - iosv
              - vmanagemock

# Lab metadata
node_count: 3
license_affinity:
    - personal
    - enterprise

# Port template (ports to be dynamically allocated per instance)
# These correspond to the serial: and vnc: tags defined on each node
port_template:
    ports:
        # PC node (n0) ports
        - name: pc_serial
          protocol: tcp
          description: Serial console for PC (Ubuntu Desktop) node
        - name: pc_vnc
          protocol: tcp
          description: VNC graphical display for PC node
        # Router node (n1) ports
        - name: router_serial
          protocol: tcp
          description: Serial console for IOSv router
        # vManageMockAPI node (n2) ports
        - name: vmanage_serial
          protocol: tcp
          description: Serial console for vManage Mock API

# Session configuration
max_duration_minutes: 120 # 2 hours max session time
warm_pool_depth: 0 # No pre-instantiated instances

# Ownership and notifications
owner_notification:
    email: lab-admin@example.com
    notify_on_start: true
    notify_on_complete: true
    notify_on_error: true

created_by: seeder

# ─────────────────────────────────────────────────────────────
# Pipeline Definitions (AD-PIPELINE-002)
#
# Each pipeline maps to a LabletSession lifecycle status transition.
# The PipelineExecutor runs all steps in an inner loop within one
# reconcile() call. Steps reference handler functions in the
# reconciler via the `handler` field (maps to _step_{handler}()).
#
# Context variables injected at runtime:
#   $SESSION    → LabletSessionReadModel (the session being reconciled)
#   $DEFINITION → LabletDefinitionState (this definition)
#   $WORKER     → Worker read model (assigned worker)
#   $STEPS      → Map of completed step result_data (DAG outputs)
# ─────────────────────────────────────────────────────────────
pipelines:
    # ── INSTANTIATE ──────────────────────────────────────────
    # Triggered when session enters INSTANTIATING status.
    # Sets up the lab environment: content sync, lab import, port
    # allocation, LDS provisioning, and readiness transition.
    instantiate:
        description: >-
            Prepare the lablet session environment — import lab topology,
            allocate ports, provision LDS session, and mark ready.
        trigger: on_status:instantiating
        max_retries: 3
        retry_backoff: 30
        steps:
            - name: content_sync
              handler: content_sync
              description: Verify definition content is synced (grade.xml, cml.yaml)
              skip_when: 'not $DEFINITION.form_qualified_name'
              timeout_seconds: 120
              retry:
                  max_attempts: 3
                  delay_seconds: 30

            - name: variables
              handler: variables
              description: Resolve session variables from definition defaults
              optional: true # failure does not block downstream steps

            - name: lab_resolve
              handler: lab_resolve
              description: Import or reuse a CML lab on the assigned worker
              needs: [content_sync, variables]
              timeout_seconds: 120
              retry:
                  max_attempts: 2
                  delay_seconds: 10

            - name: ports_alloc
              handler: ports_alloc
              description: Allocate real ports from worker pool for console access
              needs: [lab_resolve]
              skip_when: 'not $DEFINITION.port_template'
              timeout_seconds: 30

            - name: tags_sync
              handler: tags_sync
              description: Write protocol:port tags to CML nodes
              needs: [ports_alloc]
              skip_when: 'not $DEFINITION.port_template'
              timeout_seconds: 30

            - name: lab_binding
              handler: lab_binding
              description: Bind LabRecord to session, create LabRunRecord
              needs: [lab_resolve, tags_sync]
              timeout_seconds: 30

            - name: lab_start
              handler: lab_start
              description: Start the CML lab and wait for BOOTED state
              needs: [lab_binding]
              timeout_seconds: 300
              retry:
                  max_attempts: 5
                  delay_seconds: 15

            - name: lds_provision
              handler: lds_provision
              description: Create LDS session, map devices, get launch URL
              needs: [lab_start]
              skip_when: 'not $DEFINITION.form_qualified_name'
              timeout_seconds: 60

            - name: mark_ready
              handler: mark_ready
              description: Atomic transition to READY status
              needs: [lab_start, lds_provision]
              timeout_seconds: 10

        outputs:
            cml_lab_id: '$STEPS.lab_resolve.cml_lab_id'
            lab_record_id: '$STEPS.lab_resolve.lab_record_id'
            user_session_id: '$STEPS.lds_provision.user_session_id'
            launch_url: '$STEPS.lds_provision.launch_url'

    # ── COLLECT EVIDENCE ─────────────────────────────────────
    # Triggered when session enters COLLECTING status.
    # Gathers student work artifacts from the running lab.
    collect_evidence:
        description: >-
            Capture student evidence from the lab session —
            device configs, screenshots, packet captures — and
            package into an evidence bundle for grading.
        trigger: on_status:collecting
        steps:
            - name: capture_configs
              handler: capture_configs
              description: Export running-config from all managed devices
              timeout_seconds: 120

            - name: capture_screenshots
              handler: capture_screenshots
              description: Capture VNC screenshots of graphical nodes
              needs: [capture_configs]
              optional: true # best-effort — VNC may be unavailable
              timeout_seconds: 60

            - name: export_pcaps
              handler: export_pcaps
              description: Export packet capture files from bridge interfaces
              needs: [capture_configs]
              optional: true # best-effort — not all labs have pcap
              timeout_seconds: 60

            - name: package_evidence
              handler: package_evidence
              description: Bundle all artifacts into a compressed evidence package
              needs: [capture_configs] # only hard dependency
              timeout_seconds: 30

        outputs:
            evidence_uri: '$STEPS.package_evidence.evidence_uri'
            # Storage path: s3://{bucket_name}/{session_id}/evidence/

    # ── COMPUTE GRADING ──────────────────────────────────────
    # Triggered when session enters GRADING status.
    # Evaluates student evidence against grading rubric.

    compute_grading:
        description: >-
            Evaluate collected evidence against the grading rubric
            and produce a score report.
        trigger: on_status:grading
        steps:
            - name: load_rubric
              handler: load_rubric
              description: Load grading rules from definition (grade.xml)
              timeout_seconds: 30

            - name: evaluate
              handler: evaluate
              description: Run grading engine against evidence and rubric
              needs: [load_rubric]
              timeout_seconds: 120

            - name: record_score
              handler: record_score
              description: Create ScoreReport aggregate and store results
              needs: [evaluate]
              timeout_seconds: 10

        outputs:
            score: '$STEPS.evaluate.score'
            score_report_id: '$STEPS.record_score.score_report_id'

    # ── TEARDOWN ─────────────────────────────────────────────
    # Triggered when session enters STOPPING status.
    # Cleans up all lab resources and archives the session.
    teardown:
        description: >-
            Stop the lab, deregister LDS session, wipe lab state,
            and archive the session record.
        trigger: on_status:stopping
        steps:
            - name: stop_lab
              handler: stop_lab
              description: Stop the CML lab (graceful shutdown)
              timeout_seconds: 120

            - name: deregister_lds
              handler: deregister_lds
              description: Close the LDS session and release license
              needs: [stop_lab]
              skip_when: 'not $SESSION.user_session_id'
              optional: true # LDS deregistration failure should not block teardown
              timeout_seconds: 30

            - name: wipe_lab
              handler: wipe_lab
              description: Wipe lab state (reset to DEFINED_ON_CORE)
              needs: [stop_lab]
              timeout_seconds: 120

            - name: archive
              handler: archive
              description: Archive session record and transition to ARCHIVED
              needs: [wipe_lab, deregister_lds]
              timeout_seconds: 10

        outputs:
            archived_at: '$STEPS.archive.archived_at'
