# Lablet Definition: DEVASC_200-901_LAB-2.5.1
# A 2-node test lab with Ubuntu Desktop and vManage Mock API
#
# Lab Topology (from CML YAML):
#   [ubuntu-desktop] ---ens3--- eth0 [vmanage-mock]
#   (ubuntu-desktop-24-04-v2)       (mock-server)
#
# Network Configuration:
#   - ubuntu-desktop: Static 192.168.10.111/24
#   - vmanage-mock:   Static 192.168.10.1/24
#
# Port Mapping (derived from CML node tags):
#   - vmanage-mock:    serial:5041
#   - ubuntu-desktop:  serial:5042, vnc:5044

id: exam-associate-auto-v1.1-lab-lab-2.5.1-v1.0.0
name: exam-associate-auto-v1.1-lab-lab-2.5.1
version: '1.0.0'
description: >-
    A 2-node test lab with Ubuntu Desktop and vManage Mock API connected
    directly via Ethernet. The desktop queries the mock vManage REST API.
    Ideal for testing SD-WAN automation workflows (DEVASC 200-901 LAB 2.5.1).

# Content identification (FQN: trackType trackLevel trackAcronym examVersion moduleAcronym formName)
# Source: GET /api/v1/qualifiedname?mongoId=689def820afbb9684397e666
form_qualified_name: Exam Associate AUTO v1.1 LAB LAB-2.5.1

# Artifact references (populated by content sync, optional at seed time)
lab_yaml_hash: '' # Will be populated by content sync
grading_rules_uri: null # Will be populated by content sync

# Resource requirements (based on CML node definitions)
# - ubuntu-desktop-24-04-v2 (image: lablet-desktop-v0.1.1): ~2 vCPU, 4GB RAM
# - mock-server (image: mock-api-vmanage-20251028): ~1 vCPU, 1GB RAM
resource_requirements:
    cpu_cores: 3
    memory_gb: 5
    storage_gb: 50
    nested_virt: true
    ami_requirements:
        - cml_version_min: '2.7.0'
          node_definitions_required:
              - ubuntu-desktop-24-04-v2
              - mock-server

# Lab metadata
node_count: 2
license_affinity:
    - personal

# Port template (ports to be dynamically allocated per instance)
# Port names follow from_cml_nodes convention: {sanitized_node_label}_{protocol}
# CML tags: vmanage-mock [serial:5041], ubuntu-desktop [serial:5042, vnc:5044]
port_template:
    ports:
        # vmanage-mock node (n0) — tags: [serial:5041]
        - name: vmanage-mock_serial
          protocol: tcp
          description: serial on vmanage-mock
        # ubuntu-desktop node (n1) — tags: [serial:5042, vnc:5044]
        - name: ubuntu-desktop_serial
          protocol: tcp
          description: serial on ubuntu-desktop
        - name: ubuntu-desktop_vnc
          protocol: tcp
          description: vnc on ubuntu-desktop

# Session configuration
max_duration_minutes: 120 # 2 hours max session time
warm_pool_depth: 0 # No pre-instantiated instances

# Lab binding options
# When enabled, the lablet-controller will attempt to reuse an existing
# LabRecord (WIPED or STOPPED lab) on the assigned worker before importing
# a fresh topology. This reduces instantiation time significantly.
lab_reuse_enabled: true

# Ownership and notifications
owner_notification:
    email: lab-admin@example.com
    notify_on_start: true
    notify_on_complete: true
    notify_on_error: true

created_by: seeder

# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# Pipeline Definitions (AD-PIPELINE-012)
#
# Uses standard templates via `extends`. No definition-specific
# overrides needed — all timeouts and steps match defaults.
# ─────────────────────────────────────────────────────────────
pipelines:
    instantiate:
        extends: standard-instantiate

    collect_evidence:
        extends: standard-collect-evidence

    compute_grading:
        extends: standard-compute-grading

    teardown:
        extends: standard-teardown
