# Lablet Definition: DEVASC_200-901_LAB-2.9.1
# A 3-node lab with CSR1000v router, Ubuntu Desktop, and external connector
#
# Lab Topology (from CML YAML):
#   [csr1000v-0] ---Gi1--- ens3 [ubuntu-desktop-1]
#   (csr1000v)                    (ubuntu-desktop-24-04-v2)
#                                    ens4
#                                     |
#                                 [ext-conn-0]
#                                 (external_connector)
#
# Source: SVN /Lablets/200-901/LAB-2.9.1
# Mosaic: FormId=69d0d21c1dded6062c395961, FormSetId=69d0d21c1dded6062c395954
# AMI: cisco-cml2.9.1-20nodes-v0.2.2c
#
# Port Mapping (derived from CML node tags):
#   - csr1000v-0:       serial:5111, pat:5112:22
#   - ubuntu-desktop-1: serial:5113, pat:5114:22, vnc:5115

id: exam-associate-auto-v1.1-lab-lab-2.9.1-v1.0.0
name: exam-associate-auto-v1.1-lab-lab-2.9.1
version: '1.0.0'
description: >-
    A 3-node lab with a CSR1000v router, Ubuntu Desktop, and external
    connector. The desktop interacts with the router for network
    automation exercises with external connectivity
    (DEVASC 200-901 LAB 2.9.1).

# Content identification (FQN: trackType trackLevel trackAcronym examVersion moduleAcronym formName)
# Source: mosaic_meta.json → TrackShortName=AUTO, ExamVersion=1.1, FormName=LAB-2.9.1
form_qualified_name: Exam Associate AUTO v1.1 LAB LAB-2.9.1

# Artifact references (populated by content sync, optional at seed time)
lab_yaml_hash: '' # Will be populated by content sync
grading_rules_uri: null # Will be populated by content sync

# Resource requirements (based on CML node definitions)
# - csr1000v ×1:                 ~1 vCPU, 3GB RAM
# - ubuntu-desktop-24-04-v2 ×1: ~2 vCPU, 4GB RAM
# - external_connector ×1:      ~0 vCPU, 0MB
# Total: ~3 vCPU, ~7 GB RAM
resource_requirements:
    cpu_cores: 4
    memory_gb: 8
    storage_gb: 128
    nested_virt: true
    ami_requirements:
        - cml_version_min: '2.9.1'
          node_definitions_required:
              - csr1000v
              - ubuntu-desktop-24-04-v2
              - external_connector

# Lab metadata
node_count: 3
license_affinity:
    - personal

# Port template (ports to be dynamically allocated per instance)
# Port names follow from_cml_nodes convention: {sanitized_node_label}_{protocol}
port_template:
    ports:
        # csr1000v-0 — tags: [serial:5111, pat:5112:22]
        - name: csr1000v-0_serial
          protocol: tcp
          description: serial on csr1000v-0
        - name: csr1000v-0_pat_22
          protocol: tcp
          description: pat (SSH) on csr1000v-0
        # ubuntu-desktop-1 — tags: [serial:5113, pat:5114:22, vnc:5115]
        - name: ubuntu-desktop-1_serial
          protocol: tcp
          description: serial on ubuntu-desktop-1
        - name: ubuntu-desktop-1_pat_22
          protocol: tcp
          description: pat (SSH) on ubuntu-desktop-1
        - name: ubuntu-desktop-1_vnc
          protocol: tcp
          description: vnc on ubuntu-desktop-1

# Session configuration
max_duration_minutes: 120 # 2 hours max session time
warm_pool_depth: 0 # No pre-instantiated instances

# Lab binding options
lab_reuse_enabled: true

# Ownership and notifications
owner_notification:
    email: lab-admin@example.com
    notify_on_start: true
    notify_on_complete: true
    notify_on_error: true

created_by: seeder

# ─────────────────────────────────────────────────────────────
# Pipeline Definitions (AD-PIPELINE-012)
#
# Uses standard templates via `extends`. Only definition-specific
# overrides are declared inline.
# ─────────────────────────────────────────────────────────────
pipelines:
    instantiate:
        extends: standard-instantiate

    collect_evidence:
        extends: standard-collect-evidence
        remove: [export_pcaps]

    compute_grading:
        extends: standard-compute-grading

    teardown:
        extends: standard-teardown
