# Lablet Definition: DEVASC_200-901_LAB-2.5.1-JPN
# Japanese localization of LAB-2.5.1
# A 2-node lab with Ubuntu Desktop and vManage Mock API
#
# Lab Topology (from CML YAML — identical to ENU variant):
#   [ubuntu-desktop] ---ens3--- eth0 [vmanage-mock]
#   (ubuntu-desktop-24-04-v2)       (mock-server)
#
# Source: SVN /Lablets/200-901/LAB-2.5.1-JPN
# Mosaic: FormId=689def820afbb9684397e666 (same as ENU), Language=JPN
# AMI: cisco-cml2.9-lablet-v0.1.5
#
# Port Mapping (derived from CML node tags — identical to ENU):
#   - vmanage-mock:    serial:5041
#   - ubuntu-desktop:  serial:5042, vnc:5044

id: exam-associate-auto-v1.1-lab-lab-2.5.1-jpn-v1.0.0
name: exam-associate-auto-v1.1-lab-lab-2.5.1-jpn
version: '1.0.0'
description: >-
    Japanese localization of LAB-2.5.1. A 2-node lab with Ubuntu Desktop
    and vManage Mock API connected directly via Ethernet. The desktop
    queries the mock vManage REST API. Content and instructions are
    localized for Japanese language delivery (DEVASC 200-901 LAB 2.5.1 JPN).

# Content identification (FQN: trackType trackLevel trackAcronym examVersion moduleAcronym formName)
# Source: mosaic_meta.json → TrackShortName=AUTO, ExamVersion=1.1, FormName=LAB-2.5.1-JPN
# Same FormId as ENU (689def820afbb9684397e666) but Language=JPN
form_qualified_name: Exam Associate AUTO v1.1 LAB LAB-2.5.1-JPN

# Language localization
language: JPN

# Artifact references (populated by content sync, optional at seed time)
lab_yaml_hash: '' # Will be populated by content sync
grading_rules_uri: null # Will be populated by content sync

# Resource requirements (identical to ENU variant)
# - mock-server (image: mock-api-vmanage-20251028): ~1 vCPU, 1GB RAM
# - ubuntu-desktop-24-04-v2 (image: lablet-desktop-v0.1.1): ~2 vCPU, 4GB RAM
resource_requirements:
    cpu_cores: 3
    memory_gb: 5
    storage_gb: 256
    nested_virt: true
    ami_requirements:
        - cml_version_min: '2.9.0'
          node_definitions_required:
              - ubuntu-desktop-24-04-v2
              - mock-server

# Lab metadata
node_count: 2
license_affinity:
    - personal

# Port template (ports to be dynamically allocated per instance)
# Port names follow from_cml_nodes convention: {sanitized_node_label}_{protocol}
# CML tags: vmanage-mock [serial:5041], ubuntu-desktop [serial:5042, vnc:5044]
port_template:
    ports:
        # vmanage-mock node — tags: [serial:5041]
        - name: vmanage-mock_serial
          protocol: tcp
          description: serial on vmanage-mock
        # ubuntu-desktop node — tags: [serial:5042, vnc:5044]
        - name: ubuntu-desktop_serial
          protocol: tcp
          description: serial on ubuntu-desktop
        - name: ubuntu-desktop_vnc
          protocol: tcp
          description: vnc on ubuntu-desktop

# Session configuration
max_duration_minutes: 120 # 2 hours max session time
warm_pool_depth: 0 # No pre-instantiated instances

# Lab binding options
lab_reuse_enabled: true

# Ownership and notifications
owner_notification:
    email: lab-admin@example.com
    notify_on_start: true
    notify_on_complete: true
    notify_on_error: true

created_by: seeder

# ─────────────────────────────────────────────────────────────
# Pipeline Definitions (AD-PIPELINE-002)
#
# Same pipeline structure as ENU variant.
# Content sync will pull Japanese-localized content package.
# ─────────────────────────────────────────────────────────────
pipelines:
    # ── INSTANTIATE ──────────────────────────────────────────
    instantiate:
        description: >-
            Prepare the lablet session environment — import lab topology,
            allocate ports, provision LDS session, and mark ready.
        trigger: on_status:instantiating
        max_retries: 3
        retry_backoff: 30
        steps:
            - name: content_sync
              handler: content_sync
              description: Verify definition content is synced (grade.xml, cml.yaml)
              skip_when: 'not $DEFINITION.form_qualified_name'
              timeout_seconds: 120
              retry:
                  max_attempts: 3
                  delay_seconds: 30

            - name: variables
              handler: variables
              description: Resolve session variables from definition defaults
              optional: true # failure does not block downstream steps

            - name: lab_resolve
              handler: lab_resolve
              description: Import or reuse a CML lab on the assigned worker
              needs: [content_sync, variables]
              timeout_seconds: 120
              retry:
                  max_attempts: 2
                  delay_seconds: 10

            - name: ports_alloc
              handler: ports_alloc
              description: Allocate real ports from worker pool for console access
              needs: [lab_resolve]
              skip_when: 'not $DEFINITION.port_template'
              timeout_seconds: 30

            - name: tags_sync
              handler: tags_sync
              description: Write protocol:port tags to CML nodes
              needs: [ports_alloc]
              skip_when: 'not $DEFINITION.port_template'
              timeout_seconds: 30

            - name: lab_binding
              handler: lab_binding
              description: Bind LabRecord to session, create LabRunRecord
              needs: [lab_resolve, tags_sync]
              timeout_seconds: 30

            - name: lab_start
              handler: lab_start
              description: Start the CML lab and wait for BOOTED state
              needs: [lab_binding]
              timeout_seconds: 300
              retry:
                  max_attempts: 5
                  delay_seconds: 15

            - name: lds_provision
              handler: lds_provision
              description: Create LDS session, map devices, get launch URL
              needs: [lab_start]
              skip_when: 'not $DEFINITION.form_qualified_name'
              timeout_seconds: 60

            - name: mark_ready
              handler: mark_ready
              description: Atomic transition to READY status
              needs: [lab_start, lds_provision]
              timeout_seconds: 10

        outputs:
            cml_lab_id: '$STEPS.lab_resolve.cml_lab_id'
            lab_record_id: '$STEPS.lab_resolve.lab_record_id'
            user_session_id: '$STEPS.lds_provision.user_session_id'
            launch_url: '$STEPS.lds_provision.launch_url'

    # ── COLLECT EVIDENCE ─────────────────────────────────────
    collect_evidence:
        description: >-
            Capture student evidence from the lab session —
            device configs, screenshots — and package into
            an evidence bundle for grading.
        trigger: on_status:collecting
        steps:
            - name: capture_configs
              handler: capture_configs
              description: Export running-config from all managed devices
              timeout_seconds: 120

            - name: capture_screenshots
              handler: capture_screenshots
              description: Capture VNC screenshots of graphical nodes
              needs: [capture_configs]
              optional: true # best-effort — VNC may be unavailable
              timeout_seconds: 60

            - name: export_pcaps
              handler: export_pcaps
              description: Export packet capture files from bridge interfaces
              needs: [capture_configs]
              optional: true # best-effort — not all labs have pcap
              timeout_seconds: 60

            - name: package_evidence
              handler: package_evidence
              description: Bundle all artifacts into a compressed evidence package
              needs: [capture_configs] # only hard dependency
              timeout_seconds: 30

        outputs:
            evidence_uri: '$STEPS.package_evidence.evidence_uri'

    # ── COMPUTE GRADING ──────────────────────────────────────
    compute_grading:
        description: >-
            Evaluate collected evidence against the grading rubric
            and produce a score report.
        trigger: on_status:grading
        steps:
            - name: load_rubric
              handler: load_rubric
              description: Load grading rules from definition (grade.xml)
              timeout_seconds: 30

            - name: evaluate
              handler: evaluate
              description: Run grading engine against evidence and rubric
              needs: [load_rubric]
              timeout_seconds: 120

            - name: record_score
              handler: record_score
              description: Create ScoreReport aggregate and store results
              needs: [evaluate]
              timeout_seconds: 10

        outputs:
            score: '$STEPS.evaluate.score'
            score_report_id: '$STEPS.record_score.score_report_id'

    # ── TEARDOWN ─────────────────────────────────────────────
    teardown:
        description: >-
            Stop the lab, deregister LDS session, wipe lab state,
            and archive the session record.
        trigger: on_status:stopping
        steps:
            - name: stop_lab
              handler: stop_lab
              description: Stop the CML lab (graceful shutdown)
              timeout_seconds: 120

            - name: deregister_lds
              handler: deregister_lds
              description: Close the LDS session and release license
              needs: [stop_lab]
              skip_when: 'not $SESSION.user_session_id'
              optional: true
              timeout_seconds: 30

            - name: wipe_lab
              handler: wipe_lab
              description: Wipe lab state (reset to DEFINED_ON_CORE)
              needs: [stop_lab]
              timeout_seconds: 120

            - name: archive
              handler: archive
              description: Archive session record and transition to ARCHIVED
              needs: [wipe_lab, deregister_lds]
              timeout_seconds: 10

        outputs:
            archived_at: '$STEPS.archive.archived_at'
