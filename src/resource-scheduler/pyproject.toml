[tool.poetry]
name = "resource-scheduler"
version = "0.1.0"
description = "Lablet Cloud Manager - Resource Scheduler Service"
authors = ["Bruno van de Werve <bvandewe@gmail.com>"]
readme = "README.md"
packages = [{include = "application"}, {include = "domain"}, {include = "integration"}, {include = "infrastructure"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
neuroglia-python = ">=0.6.9,<0.7.0"
httpx = ">=0.24.0,<0.28.0"
etcd3-py = "^0.1.6"  # etcd client for leader election and state watches
aiohttp = "^3.9.0"
pyyaml = ">=6.0.0,<7.0.0"  # Required by lcm-core seeding
uvicorn = ">=0.24.0,<1.0.0"  # ASGI server for health endpoints
lcm-core = {path = "../core", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = "^1.11.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^1.3.0"
watchfiles = "^0.21.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 200
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 200

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]
