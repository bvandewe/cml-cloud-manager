theme:
    name: material
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.expand
        - navigation.top
        - search.highlight
        - search.share
    palette:
        - scheme: default
          primary: blue
          accent: blue
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - scheme: slate
          primary: blue
          accent: blue
          toggle:
              icon: material/brightness-4
              name: Switch to light mode

markdown_extensions:
    - admonition
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets:
          base_path: ['.']
          check_paths: true
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format # yamllint disable-line


    - toc:
          permalink: true
    - pymdownx.details
    - pymdownx.tabbed:
          alternate_style: true

plugins:
    - search
    - mermaid2:
          arguments:
              theme: auto
              themeVariables:
                  primaryColor: '#1976d2'
                  primaryTextColor: '#ffffff'
                  primaryBorderColor: '#1976d2'
                  lineColor: '#1976d2'
                  secondaryColor: '#f5f5f5'
                  tertiaryColor: '#ffffff'

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/bvandewe/lablet-cloud-manager
