              permissions: "0755"
              content: |
                # Welcome to Your AUTOCOR Workstation
  
                This Ubuntu Desktop has all the tools you need for your lab exercises.
                
                As instructed, please follow the steps below to get started.

                ## Getting Started

                ### Python Virtual Environment

                - Open a terminal
                - Navigate to the `~/Desktop/tasks/` directory (`cd ~/Desktop/tasks/`)
                - Activate the Python virtual environment with `source venv/bin/activate`

                (This is done automatically by VS Code when you open a terminal there.)

                ### Configuration Reference

                Before modifying the script, ensure you are familiar with the target environment details:
                - Target Device IP: 10.10.20.85
                - Management Protocol: RESTCONF (HTTPS)
                - Authentication: Basic Auth (administrator / Cisco1234!)
                - Required Hostname: CSR1K-PROD-01

                ### Python Script Task

                - You are required to fix the app.py script located in the CandidateTasks folder.
                - Open the Code: Open the CandidateTasks folder in VS Code.
                - Identify Errors: Locate the #TODO markers within app.py.
                - Task 1 (Headers): Update the headers to use the correct RESTCONF media type (application/yang-data+json).
                - Task 2 (Payload & Method): Include the JSON payload structure in the request and update the HTTP method to the appropriate verb for resource replacement.
                - Run the script from the terminal `python app.py`

                ### Verification

                - Status Code: Ensure the script returns a successful HTTP status code (200 OK or 204 No Content).
                - Device Hostname: Script verifies that the hostname has successfully changed to CSR1K-PROD-01, ensure you get a successful message output from script.

                ## Desktop Package Contents

                **What's installed on this desktop:**

                - VS Code (code editor)
                - Terminal (command line)
                - Python 3.12 (includes requests, urllib, and other automation libraries)
                - File Manager (browse your files)
                - And more!
            
            - path: /home/cisco/Desktop/tasks/app.py
              permissions: "0755"
              content: |
                import requests
                from requests.auth import HTTPBasicAuth
                import urllib3

                urllib3.disable_warnings()

                # Device Details
                TARGET_IP = "10.10.20.85"
                USER = "administrator"
                PASS = "Cisco1234!"
                auth=HTTPBasicAuth(USER, PASS)

                # RESTCONF URL for the Hostname leaf
                URL = f"https://{TARGET_IP}/restconf/data/Cisco-IOS-XE-native:native/hostname"

                # TODO: Fix the Headers, 
                # RestConf requires a specific 'yang-data' content type
                headers = {
                    "Accept": "application/json",
                    "Content-Type": "application/json"
                }

                def get_hostname(url, auth, headers):
                  response = requests.get(url, auth=auth, headers=headers, verify=False)
                  if response.status_code == 200:
                      return response.json().get("Cisco-IOS-XE-native:hostname")
                  return "Error"
                
                current_name = get_hostname(URL, auth, headers)
                print(f"Current Hostname: {current_name}")

                new_hostname_payload = {
                    "Cisco-IOS-XE-native:hostname": "CSR1K-PROD-01"
                }

                # TODO: Fix the request below to use the correct method and include the payload
                print(f"Changing hostname to CSR1K-PROD-01...")
                response = requests.get(
                    URL, 
                    auth=auth, 
                    headers=headers, 
                    verify=False
                )

                updated_name = get_hostname(URL, auth, headers)
                if updated_name == "CSR1K-PROD-01":
                    print(f"Verification Success! New Hostname: {updated_name}")
                else:
                    print(f"Failed to update.")
                print(f"Status Code: {response.status_code}")
                
          # Commands to run on first boot
          runcmd:
            # Ensure proper ownership
            - chown -R cisco:cisco /home/cisco/Desktop/tasks

            # Final message
            - echo "Desktop provisioning complete" >> /var/log/cloud-init-custom.log

          # Commands to run on every boot
          bootcmd:
            - echo "System booted at $(date)" >> /var/log/boot-times.log

      - name: network-config
        content: |-
          network:
            version: 2
            ethernets:
              ens4:
                dhcp4: true
              ens3:
                dhcp4: false
                addresses:
                  - 10.10.20.100/24
