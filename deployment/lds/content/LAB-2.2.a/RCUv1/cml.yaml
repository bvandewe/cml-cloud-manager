    configuration:
      - name: user-data
        content: |-
          #cloud-config

          # Network configuration
          manage_etc_hosts: False

          # Hostname
          hostname: workstation

          # System-wide SSH configuration
          ssh_pwauth: True

          # Define the cisco user with all properties
          users:
            - name: cisco
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              plain_text_passwd: cisco
              lock_passwd: false

          # Disable the default ubuntu user (optional - only if you want ONLY cisco user)
          # - name: ubuntu
          #   lock_passwd: true
          #   inactive: true

          # Write custom scripts and files
          write_files:
            - path: /usr/local/bin/lab-setup.sh
              permissions: "0755"
              content: |
                #!/bin/bash
                set -e

                # Wait for desktop
                # sleep 15

                # Add bookmarks
                su - cisco -c '/home/cisco/add_bookmark.sh -y "GitLab Username-root-Password-Cisc01@3" "http://192.168.10.13/lab/Candidate-Tasks" || true'

                # git global user.email
                su - cisco -c 'git config --global user.name root'
                su - cisco -c 'git config --global user.email gitlab_admin_b63792@example.com'

                # Log completion
                echo "Lab setup completed at $(date)" >> /var/log/lab-setup.log

          # Commands to run on first boot
          runcmd:
            # DNS in /etc/hosts
            - echo "192.168.10.13 gitlab.lab.local" >> /etc/hosts

            # restore "python3"
            - ln -s /usr/bin/python3 /usr/local/bin/python3

            # Run lab setup
            - /usr/local/bin/lab-setup.sh >> /var/log/lab-setup.log 2>&1

            # Empty Desktop/tasks, and rename it, and update VScode-dir
            - rm -rf /home/cisco/Desktop/tasks/venv
            - rm -rf /home/cisco/Desktop/tasks/.vscode
            - rm -rf /home/cisco/Desktop/tasks/requirements.txt
            - mv /home/cisco/Desktop/tasks "/home/cisco/Desktop/CandidateTasks"
            - sed -i 's/tasks/CandidateTasks/g' /home/cisco/Desktop/Open_Tasks_in_VSCode.desktop

            # Ensure proper ownership
            - chown -R cisco:cisco "/home/cisco/Desktop/CandidateTasks"

            # Token for using gitlab: git clone
            - mkdir -p /home/cisco/.ssh
            - |
