server {
    listen 4001;
    server_name _;

    # Use Docker's internal DNS resolver so nginx can resolve container names
    # at request time (not just at startup). valid=30s caches results for 30s.
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect root to the Nuxt SPA base path
    location = / {
        return 302 $scheme://$http_host/static/v3client/;
    }

    # Nuxt SPA - serve at its built base path
    # no-cache = browser must revalidate with server before using cached copy;
    # prevents stale index.html from being served after nginx routing changes.
    location /static/v3client/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /static/v3client/index.html;
    }

    # Nuxt static assets (long-term cache)
    location /static/v3client/_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend config endpoint
    # Using a variable forces runtime DNS resolution (not startup-time)
    location = /config {
        set $backend http://lds-backend:4000;
        proxy_pass $backend/api/v3/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API proxy
    location /api/ {
        set $backend http://lds-backend:4000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lablet backend API — proxy /lablet/v1/* to pyLDS (session start, JWT auth)
    # Must appear before the generic /lablet/ SPA fallback so nginx matches the
    # longer prefix first and proxies instead of serving index.html.
    location /lablet/v1/ {
        set $backend http://lds-backend:4000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lablet SPA route — rewrite to the Nuxt SPA
    location /lablet/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /static/v3client/index.html;
    }
}
